name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Mizan-project.zip

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle 8.7 wrapper
        run: |
          mkdir /tmp/w
          cd /tmp/w
          gradle wrapper --gradle-version 8.7
          cp -r /tmp/w/gradlew /tmp/w/gradlew.bat /tmp/w/gradle "$GITHUB_WORKSPACE/Mizan/"

      - name: Build debug APK
        working-directory: Mizan
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Mizan-APK
          path: Mizan/app/build/outputs/apk/debug/app-debug.apk
